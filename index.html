<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Review and accept the Terms and Conditions.">
  <title>Terms and Conditions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="card" aria-labelledby="page-title">
      <header class="card-header">
        <p class="eyebrow">Agreement</p>
        <h1 id="page-title">Terms and Conditions</h1>
        <p class="intro">Please read the terms below, then complete the declaration.</p>
      </header>

      <article id="terms" class="terms" aria-live="polite" aria-busy="true">
        <p class="loading">Loading terms…</p>
      </article>

      <form id="acceptance-form" class="acceptance-form">
        <div id="questions" class="questions" aria-live="polite" aria-busy="true">
          <p class="loading">Loading questions...</p>
        </div>

        <button id="accept-button" type="submit" disabled>Submit declaration</button>
        <button id="export-button" class="secondary-button" type="button" disabled>Download Excel log</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
